<main class="auth-shell">
  <div class="backdrop-orb orb-one"></div>
  <div class="backdrop-orb orb-two"></div>

  <section class="auth-card" aria-label="Signup panel">
    <div class="brand-block">
      <span class="brand-pill">Create account</span>
      <h1>Join the platform</h1>
      <p>Create your profile and start managing your files in minutes.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="form-field">
        <span>Full name</span>
        <input type="text" formControlName="name" placeholder="Jane Doe" autocomplete="name" />
      </label>

      <label class="form-field">
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </label>

      <label class="form-field">
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          placeholder="At least 8 characters"
          autocomplete="new-password"
        />
      </label>

      <button type="submit" class="primary-button" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating account...' : 'Create account' }}
      </button>

      @if (errorMessage) {
        <p class="status-message error-message">{{ errorMessage }}</p>
      }

      @if (successMessage) {
        <p class="status-message success-message">{{ successMessage }}</p>
      }
    </form>

    <p class="switch-copy">
      Already have an account?
      <a routerLink="/login" class="inline-link">Sign in</a>
    </p>
  </section>
</main>
